[Widescreen]
; 1 enables the patch; 0 runs with the game's original settings.
Enabled=1

; Supported 16:9 modes: 1280x720, 1920x1080, 2560x1440, 3840x2160.
; Supported 4:3 modes: 800x600, 1024x768, 1600x1200.
; Any other pair disables the patch and leaves the game's D3D9 request intact.
Width=1920
Height=1080

; Replaces the game's MingLiU font. Use an installed Windows font family name.
; Used for fonts taller than SmallFontMaxHeight.
FontName=SimHei

; Scales only the replacement font height. Valid range: 0.75 to 1.50.
; Keep 1.00 for the game's fixed glyph cells; excessive scaling can clip text.
FontScale=1.35

; Small-font override. Set SmallFontMaxHeight=0 to disable size-based routing.
; Absolute LOGFONT heights up to this value use SmallFontName/SmallFontScale.
SmallFontName=SimHei
SmallFontMaxHeight=16
SmallFontScale=1.35

; 0 keeps a normal resizable window; 1 removes borders and the title bar.
Borderless=0

; 1 keeps native widescreen 3D rendering. This is the recommended mode.
NativeRender=1

; UI scaling only affects the original 800x600 UI viewport:
; 0 = original top-left UI, 1 = centered aspect-correct UI,
; 2 = expand the UI viewport to the selected output mode.
UIScaleMode=2

; Master switch for development diagnostics. Keep this at 0 for normal and
; release use. Diagnostic probes below are ignored unless DebugMode is 1.
DebugMode=0

; Debug only: logs the first pre-transformed 2D draw calls without changing them.
UIDrawDiagnostics=0

; Skip 2D quads whose vertex alpha is zero. The original renderer otherwise
; shows transparent proxy containers as solid gray rectangles.
SuppressTransparentUI=0

; Debug only: targeted probe for the 336x35 and 320x46 proxy/background layers.
UIContainerProbe=0

; Hide only the textureless grey proxy rectangles created by the HUD wrappers.
SuppressProxyContainers=0

; Debug only: read-only runtime scanner used while locating the shared GUI manager.
GUIRuntimeProbe=0

; Repositions direct children of the original 800x600 GUI root using automatic
; left/center/right and top/center/bottom anchors. Rendering and hit rectangles
; share the same object coordinates, so toolbar submenus remain interactive.
UnifiedUILayout=1

; Title-screen presentation:
; 0 = keep the original centered 800x600 page;
; 1 = enlarge it uniformly to the tallest centered 4:3 viewport (recommended).
; On 16:9 output this creates side wings; on 4:3 it fills the output.
TitleScreenMode=1
