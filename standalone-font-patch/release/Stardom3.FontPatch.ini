[FontPatch]
; 1 enables MingLiU replacement; 0 preserves every original font request.
Enabled=1

; Installed Windows font family used in place of MingLiU.
; Used for fonts taller than SmallFontMaxHeight.
FontName=SimHei

; Replacement font height multiplier. Keep 1.00 for the game's fixed glyph cells.
; Valid range: 0.75 to 1.50.
FontScale=1.00

; Small-font override. Set SmallFontMaxHeight=0 to disable size-based routing.
; SmallFontWeight=0 preserves the game's weight; 100-900 forces a GDI weight.
SmallFontName=SimSun
SmallFontMaxHeight=16
SmallFontScale=1.00
SmallFontWeight=600
